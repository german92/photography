<section class="contact a-fade" id="contacto">
  <div class="contact__inner">

    <div class="contact__left">
      <p class="contact__label">Contacto</p>
      <h2 class="contact__title">Hablemos</h2>
      <p class="contact__text">Si conectás con esta forma de ver la fotografía, me encantaría escuchar sobre tu proyecto.</p>
      <div class="contact__links">
        <a href="https://wa.me/50688872213" class="contact__link" target="_blank">
          <i class="fa-brands fa-whatsapp"></i> +506 8887-2213
        </a>
        <a href="mailto:german92@gmail.com" class="contact__link">
          <i class="fa-regular fa-envelope"></i> german92@gmail.com
        </a>
        <a href="https://www.instagram.com/germanosta.photo/" class="contact__link" target="_blank">
          <i class="fa-brands fa-instagram"></i> @germanosta.photo
        </a>
      </div>
    </div>

    <div class="contact__right">
      <form class="contact-form" action="https://formspree.io/f/mwvrqrwz" method="POST">
        <input type="hidden" name="_subject" value="Nuevo mensaje desde germanosta.com">

        <div class="contact-form__field">
          <label class="contact-form__label" for="name">Nombre</label>
          <input class="contact-form__input" type="text" id="name" name="name" placeholder="Tu nombre" required>
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="email">Email</label>
          <input class="contact-form__input" type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="phone">WhatsApp / Teléfono</label>
          <input class="contact-form__input" type="tel" id="phone" name="phone" placeholder="+506 8888 8888" required>
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="type">Tipo de sesión</label>
          <select class="contact-form__input contact-form__select" id="type" name="type">
            <option value="">Seleccioná una opción</option>
            <option value="boda">Boda</option>
            <option value="compromiso">Compromiso / Pre-boda</option>
            <option value="evento">Evento</option>
            <option value="retrato">Retrato</option>
            <option value="familia">Familia</option>
            <option value="embarazo">Embarazo</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="message">Mensaje</label>
          <textarea class="contact-form__input contact-form__textarea" id="message" name="message" placeholder="Contame sobre tu proyecto..." required></textarea>
        </div>

        <button class="contact-form__btn" type="submit">Enviar mensaje</button>
      </form>
    </div>

  </div>
</section>
