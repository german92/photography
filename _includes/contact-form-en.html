<section class="contact a-fade" id="contact">
  <div class="contact__inner">

    <div class="contact__left">
      <p class="contact__label">Contact</p>
      <h2 class="contact__title">Let's talk</h2>
      <p class="contact__text">If you connect with this way of seeing photography, I'd love to hear about your project. Reach out through any of these channels or fill out the form.</p>
      <div class="contact__links">
        <a href="https://wa.me/50688872213" class="contact__link" target="_blank">
          <i class="fa-brands fa-whatsapp"></i> +506 8887-2213
        </a>
        <a href="mailto:german92@gmail.com" class="contact__link">
          <i class="fa-regular fa-envelope"></i> german92@gmail.com
        </a>
        <a href="https://www.instagram.com/germanosta.photo/" class="contact__link" target="_blank">
          <i class="fa-brands fa-instagram"></i> @germanosta.photo
        </a>
      </div>
    </div>

    <div class="contact__right">
      <form class="contact-form" action="https://formspree.io/f/mwvrqrwz" method="POST">
        <input type="hidden" name="_subject" value="New message from germanosta.com">

        <div class="contact-form__field">
          <label class="contact-form__label" for="name-en">Name</label>
          <input class="contact-form__input" type="text" id="name-en" name="name" placeholder="Your name" required>
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="email-en">Email</label>
          <input class="contact-form__input" type="email" id="email-en" name="email" placeholder="your@email.com" required>
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="phone-en">WhatsApp / Phone</label>
          <input class="contact-form__input" type="tel" id="phone-en" name="phone" placeholder="+1 555 000 0000" required>
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="type-en">Session type</label>
          <select class="contact-form__input contact-form__select" id="type-en" name="type">
            <option value="">Select an option</option>
            <option value="destination-wedding">Destination Wedding</option>
            <option value="wedding">Wedding</option>
            <option value="engagement">Engagement session</option>
            <option value="event">Event</option>
            <option value="portrait">Portrait</option>
            <option value="family">Family</option>
            <option value="maternity">Maternity</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="date-en">Event date (if applicable)</label>
          <input class="contact-form__input" type="text" id="date-en" name="date" placeholder="e.g. March 2026">
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="message-en">Message</label>
          <textarea class="contact-form__input contact-form__textarea" id="message-en" name="message" placeholder="Tell me about your project..." required></textarea>
        </div>

        <button class="contact-form__btn" type="submit">Send message</button>
      </form>
    </div>

  </div>
</section>
