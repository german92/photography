---
layout: base
---

<div class="home">
  {%- if page.title -%}
    <h1 class="page-heading">{{ page.title }}</h1>
  {%- endif -%}

  <div class="welcome-container">
    <div class="welcome-item welcome-title">
      <p>fotografía.</p>
    </div>

    <div class="welcome-item welcome-photo">
      <img src=" {{ site.imagepath }}tali.jpg " alt="Portrait Tali">
    </div>
  </div>

  <h1 class="home-title">Trabajos</h1>

  <div class="different-jobs">

    <div class="job">
      <a href="">
        <img src=" {{ site.imagepath }}tali.jpg " alt="Portrait Tali">
      </a>
      <p>weddings</p>
    </div>

    <div class="job">
      <img src=" {{ site.imagepath }}tali.jpg " alt="Portrait Tali">
      <p>portraits</p>
    </div>

    <div class="job">
      <img src=" {{ site.imagepath }}tali.jpg " alt="Portrait Tali">
      <p>Personal Projects</p>
    </div>

  </div>
